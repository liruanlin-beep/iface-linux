name: Linux tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install structures support
        run: |
          python -m venv "$RUNNER_TEMP/iface-venv"
          echo "$RUNNER_TEMP/iface-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iface-venv/bin/python" -m pip install '.[structures]'
      - name: Verify shell script and commands
        run: |
          bash -n install.sh
          iface --version
          iface --help
          python -m pip check
      - name: Test installed package from outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Build source releases
        run: python tools/build_release.py --output "$RUNNER_TEMP/release"
