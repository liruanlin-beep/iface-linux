[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iface-linux"
version = "4.0.1"
description = "Full Linux desktop port of the original iface Windows application"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "pymatgen>=2024.5.1",
  "matplotlib>=3.8",
  "pillow>=10",
  "paramiko>=3.4",
  "tkinterdnd2>=0.4",
  "keyring>=25; sys_platform == 'linux'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
iface = "app.main:main"

[project.urls]
Repository = "https://github.com/liruanlin-beep/iface-linux"
Issues = "https://github.com/liruanlin-beep/iface-linux/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/translations/*.json", "resources/templates/*.sh", "resources/*.ico"]
